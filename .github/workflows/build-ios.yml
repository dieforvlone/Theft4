name: iOS Build

# Builds the unsigned, sideload-ready Theft4 IPA the same way as
# tools/build_ios_release.sh (see docs/IOS_RELEASE_BUILD.md). The resulting
# IPA contains no game data and must be re-signed by the user's sideloading
# tool. Download it from the run's "Artifacts" section.

on:
  push:
    branches: ['claude/**', 'mercy-build']
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.github/workflows/runner-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-ios-${{ github.ref }}
  cancel-in-progress: true

env:
  CLICOLOR_FORCE: 1

jobs:
  ipa:
    name: Unsigned iOS IPA
    # The newest Xcode 26 or later installed on the image is selected below.
    runs-on: xcode-27
    timeout-minutes: 330

    steps:
      # tools/setup_repo.py initializes every pinned submodule (shallow) and
      # applies the reviewed dependency patches, so the checkout itself does
      # not fetch submodules a second time.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: Theft4
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Select Xcode 26 or newer
        run: |
          set -euo pipefail
          ls -d /Applications/Xcode*.app || true
          # Theft4 targets iOS 26.0, which needs Xcode 26 or newer.
          xcode="$(find /Applications -maxdepth 1 -name 'Xcode_2[6-9]*.app' | sort -V | tail -n 1)"
          if [[ -z "$xcode" ]]; then
            version="$(/usr/bin/xcodebuild -version 2>/dev/null | head -n 1 | awk '{print $2}')"
            if [[ "${version%%.*}" -ge 26 ]]; then
              xcode=/Applications/Xcode.app
            else
              echo "::error::This runner image has no Xcode 26 or newer (default is ${version:-unknown})."
              exit 1
            fi
          fi
          echo "Using $xcode"
          sudo xcode-select -s "$xcode/Contents/Developer"
          echo "DEVELOPER_DIR=$xcode/Contents/Developer" >> "$GITHUB_ENV"
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      # Compile the launcher UI alone against the iPhoneOS SDK, both with and
      # without the optional feature macros, so an error in it fails in about
      # a minute instead of after the full build.
      - name: Launcher compile check
        working-directory: Theft4
        run: |
          set -euo pipefail
          sdk="$(xcrun --sdk iphoneos --show-sdk-path)"
          for defines in "" "-DTHEFT4_DIRECT_METAL_DEFAULT=1 -DTHEFT4_BC_TEXTURE_COMPATIBILITY=1"; do
            xcrun --sdk iphoneos clang -fsyntax-only -fobjc-arc -x objective-c \
              -target arm64-apple-ios26.0 -isysroot "$sdk" \
              -Iios/Theft4 -Iios/bridge $defines ios/Theft4/Theft4LauncherView.m
          done
          echo "Launcher compiles."

      - name: Free disk space
        run: |
          df -h "$GITHUB_WORKSPACE"
          # Older Xcode releases are unused by this build and take tens of GB.
          for app in /Applications/Xcode_1[0-6]*.app; do
            if [[ -d "$app" ]]; then sudo rm -rf "$app"; fi
          done
          df -h "$GITHUB_WORKSPACE"

      - name: Install build tools
        run: |
          set -euo pipefail
          brew install cmake || brew upgrade cmake || true
          cmake --version
          python3 - <<'PY'
          import re, subprocess
          version = subprocess.run(['cmake', '--version'], capture_output=True, text=True).stdout
          major, minor = map(int, re.search(r'(\d+)\.(\d+)', version).groups())
          if (major, minor) < (3, 29):
              raise SystemExit(f'CMake 3.29 or newer is required, found {major}.{minor}')
          PY

      - name: Prepare pinned dependencies and patches
        working-directory: Theft4
        run: |
          set -euo pipefail
          python3 tools/setup_repo.py --jobs 6
          python3 tools/setup_repo.py --check
          df -h "$GITHUB_WORKSPACE"

      # Quick source-level checks that compile parts of the iOS launcher with
      # Xcode. They run before the long build so a launcher error shows up in
      # minutes; they report without blocking the build.
      - name: Quick iOS source checks
        working-directory: Theft4
        continue-on-error: true
        run: |
          status=0
          for test in tests/ios/test_*.py; do
            echo "::group::$test"
            python3 "$test" || status=1
            echo "::endgroup::"
          done
          exit $status

      # ------------------------------------------------------------------
      # MoltenVK / SPIRV iPhoneOS archives (tools/ios-moltenvk), built from
      # the workspace's pinned, patched sources and cached by their revisions
      # ------------------------------------------------------------------
      - name: Compute MoltenVK archive cache key
        id: mvk-key
        working-directory: Theft4
        run: |
          set -euo pipefail
          revisions="$(git ls-tree HEAD thirdparty/MoltenVK/MoltenVK thirdparty/MoltenVK/SPIRV-Cross \
            glue/rexglue-sdk-main/thirdparty/spirv-tools glue/rexglue-sdk-main/thirdparty/spirv-headers \
            thirdparty/plume | awk '{print $3}' | tr '\n' '-')"
          files="$(shasum -a 256 tools/ios-moltenvk/CMakeLists.txt cmake/dependency-patches/moltenvk.patch | awk '{print $1}' | tr '\n' '-')"
          xcode="$(xcodebuild -version | tr -d '\n ')"
          key="ios-moltenvk-$(printf '%s' "$revisions$files$xcode" | shasum -a 256 | cut -c1-24)"
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "$key"

      - name: Restore MoltenVK archives
        id: mvk-cache
        uses: actions/cache@v4
        with:
          path: Theft4/out/ios-moltenvk/lib
          key: ${{ steps.mvk-key.outputs.key }}

      - name: Build MoltenVK archives for iPhoneOS
        if: steps.mvk-cache.outputs.cache-hit != 'true'
        working-directory: Theft4
        run: |
          set -euo pipefail
          cmake -S tools/ios-moltenvk -B out/ios-moltenvk -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=26.0 \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO
          cmake --build out/ios-moltenvk --config Release --target theft4_ios_moltenvk --parallel 3

      - name: Check MoltenVK archives
        working-directory: Theft4
        run: |
          set -euo pipefail
          lib_dir="$PWD/out/ios-moltenvk/lib"
          for library in libMoltenVK.a libMoltenVK_ShaderConverter.a libMoltenVK_Common.a \
                         libspirv-cross.a libSPIRV-Tools.a; do
            if [[ ! -f "$lib_dir/$library" ]]; then
              echo "::error::Missing $lib_dir/$library"
              find out/ios-moltenvk -name '*.a' | head -50
              exit 1
            fi
            # Device archives only: no simulator or macOS slices.
            lipo -info "$lib_dir/$library"
          done
          echo "THEFT4_MOLTENVK_IOS_LIB_DIR=$lib_dir" >> "$GITHUB_ENV"

      # ------------------------------------------------------------------
      # Offline Metal shader libraries (from the shader corpus in the repo)
      # ------------------------------------------------------------------
      - name: Build Metal shader exporters
        working-directory: Theft4
        run: |
          set -euo pipefail
          cmake -S tools/direct-metal -B out/direct-metal/build -DCMAKE_BUILD_TYPE=Release
          cmake --build out/direct-metal/build --target metal_shader_export metal_host_shader_export --parallel 3

      - name: Export and compile Metal shaders for iOS
        working-directory: Theft4
        run: |
          set -euo pipefail
          out/direct-metal/build/metal_shader_export out/direct-metal/corpus
          out/direct-metal/build/metal_host_shader_export out/direct-metal/host-corpus
          python3 tools/direct-metal/compile_shaders.py out/direct-metal/corpus out/direct-metal/ios --platform ios
          python3 tools/direct-metal/compile_shaders.py out/direct-metal/host-corpus out/direct-metal/ios/Host --platform ios
          test -f out/direct-metal/ios/manifest.tsv
          test -f out/direct-metal/ios/Host/HOST_SHADER_MANIFEST.json
          # The exporter build tree is no longer needed.
          rm -rf out/direct-metal/build
          echo "THEFT4_METAL_LIBRARIES=$PWD/out/direct-metal/ios" >> "$GITHUB_ENV"
          echo "THEFT4_METAL_HOST_LIBRARIES=$PWD/out/direct-metal/ios/Host" >> "$GITHUB_ENV"
          df -h "$GITHUB_WORKSPACE"

      # ------------------------------------------------------------------
      # Theft4 app and unsigned IPA
      # ------------------------------------------------------------------
      - name: Build Theft4 and package the unsigned IPA
        working-directory: Theft4
        env:
          THEFT4_BUILD_JOBS: 3
          # iPhone Duo (A20 Pro, iPhone19,*) only build: the first -mcpu the
          # compiler accepts is used; the launcher refuses other devices.
          THEFT4_ARM64_CPU: "apple-a19;apple-a18;apple-a17"
          THEFT4_DEVICE_BUILD_PREFIX: "iPhone19,"
        run: ./tools/build_ios_release.sh

      # The artifact is named after the packaged IPA (for example
      # Theft4_0.3.3_Beta_Mercy_Build), plus the commit for traceability.
      - name: Name the IPA artifact
        id: ipa-name
        working-directory: Theft4
        run: |
          set -euo pipefail
          ipa="$(ls dist/*.ipa | head -n 1)"
          name="$(basename "$ipa" .ipa)"
          echo "name=${name}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "$name"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ipa-name.outputs.name }}
          path: |
            Theft4/dist/*.ipa
            Theft4/dist/*.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Disk usage on failure
        if: failure()
        run: df -h "$GITHUB_WORKSPACE"
