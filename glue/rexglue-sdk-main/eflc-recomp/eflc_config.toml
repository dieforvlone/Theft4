# Episodes from Liberty City - ReXGlue Codegen Configuration
# Xbox 360 Static Recompilation - standalone EFLC disc executable
#
# STATUS: starter configuration. The codegen flags and analysis limits below
# match gta4-recomp/gta4_config.toml as a known-good starting point for the
# same engine family. No guest addresses have been filled in yet.
#
# Do NOT copy addresses from gta4_config.toml. EFLC is a different executable;
# every address must be re-derived from the EFLC binary. A wrong rexcrt
# address silently corrupts memory at every call site (see the memset/memcpy
# note in gta4_config.toml).

skip_lr = false
ctr_as_local = false
xer_as_local = false
reserved_as_local = false
skip_msr = false
cr_as_local = false
non_argument_as_local = false
non_volatile_as_local = false

[analysis]
max_jump_extension = 65536
data_region_threshold = 16
large_function_threshold = 1048576

# rexcrt: Replace statically-linked PPC CRT functions with native implementations.
# Leave empty until each address is verified in the EFLC binary (FLIRT match
# plus caller count and leaf-shape check, as documented in gta4_config.toml).
# Format: FunctionName = guest_address
[rexcrt]
# memset  = 0x????????
# memcpy  = 0x????????
# memmove = 0x????????

[functions]
# Cross-function branch targets, address-taken thunks, script-native callbacks
# and CRT constructor thunks that automatic discovery misses. GTA IV needed 79
# of these. Find EFLC's equivalents by porting each category in gta4_config.toml
# (see README.md, "Codegen configuration").
